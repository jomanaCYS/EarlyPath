<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EarlyPath | درب الكشف المبكر</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}
body{font-family:Cairo,sans-serif;background:#F7F1E8;color:#554A45}
button,input{font:inherit}
.card{background:white;border:1px solid #E8D8C5;border-radius:22px;padding:25px;box-shadow:0 5px 20px #554a450d}
.btn{padding:13px 18px;border-radius:13px;font-weight:700}
.primary{background:#55766D;color:white}
.choice{display:block;width:100%;padding:13px;margin:8px 0;text-align:start;border:1.5px solid #E8D8C5;border-radius:13px;background:white}
.choice.selected{border-color:#55766D;background:#E7EDE4}
.hidden{display:none!important}
.pill{background:#E7EDE4;color:#55766D;padding:5px 12px;border-radius:20px;font-size:12px}
</style>
</head>

<body class="min-h-screen flex flex-col">

<header class="bg-white border-b border-[#E8D8C5]">
<div class="max-w-3xl mx-auto px-5 py-4 flex justify-between items-center">
<button onclick="goHome()" class="flex items-center gap-3">
<span class="text-3xl">🌿</span>
<span>
<b class="block text-xl text-[#55766D]">EarlyPath</b>
<small id="brand">درب الكشف المبكر</small>
</span>
</button>
<span class="pill">MEDATHON</span>
</div>
</header>

<main class="max-w-3xl w-full mx-auto px-4 py-8 flex-1">

<section id="home" class="card text-center">
<div class="text-5xl mb-4">🌱</div>
<h1 class="text-3xl font-extrabold text-[#55766D]">EarlyPath</h1>
<p class="text-lg mt-3">درب الكشف المبكر</p>
<p class="text-lg mt-2" dir="ltr">Every early step makes a difference.</p>
<p class="my-7">كل خطوة مبكرة تصنع فرقًا</p>

<h3 id="languageTitle" class="font-bold mb-4">اختيار اللغة / Choose your language</h3>

<div class="grid sm:grid-cols-2 gap-4">
<button class="choice text-center" onclick="setLanguage('ar')">🇸🇦 العربية</button>
<button class="choice text-center" onclick="setLanguage('en')">🇬🇧 English</button>
</div>

<p class="text-xs mt-6 text-gray-500">
أداة توعوية أولية لا تقدم تشخيصًا طبيًا ولا تستبدل مراجعة الطبيب.
</p>
</section>

<section id="type" class="card hidden">
<h2 id="typeTitle" class="text-2xl font-bold text-[#55766D] mb-3"></h2>
<p id="typeQuestion" class="mb-5"></p>

<div class="grid sm:grid-cols-2 gap-4">
<button class="choice text-center" onclick="startPath('breast')">
<div class="text-4xl mb-3">🎗️</div>
<b id="breastLabel"></b>
</button>

<button class="choice text-center" onclick="startPath('colon')">
<div class="text-4xl mb-3">🩺</div>
<b id="colonLabel"></b>
</button>
</div>

<button class="btn border mt-5 w-full" onclick="goHome()" id="backHome"></button>
</section>

<section id="questions" class="card hidden">
<div class="flex justify-between">
<span class="pill" id="pathLabel"></span>
<span class="text-xs text-gray-500" id="stepLabel"></span>
</div>

<h2 id="questionTitle" class="text-xl font-bold text-[#55766D] mt-5 mb-4"></h2>
<div id="questionBody"></div>

<div class="flex gap-3 mt-7">
<button class="btn border flex-1" onclick="goType()" id="backButton"></button>
<button class="btn primary flex-1" onclick="nextQuestion()" id="nextButton"></button>
</div>
</section>

<section id="result" class="card hidden">
<div class="text-center">
<div id="resultIcon" class="text-5xl mb-4"></div>
<h2 id="resultTitle" class="text-2xl font-bold text-[#55766D] mb-4"></h2>
<p id="resultDescription" class="leading-8"></p>
</div>

<div id="resultNote" class="bg-[#F7F1E8] p-4 rounded-xl mt-6 leading-8"></div>
<div id="resultActions" class="grid sm:grid-cols-2 gap-3 mt-6"></div>

<button class="btn border w-full mt-6" onclick="goHome()" id="restartButton"></button>
</section>

<section id="emergency" class="card hidden">
<div class="text-center text-4xl">🚨</div>
<h2 id="emergencyTitle" class="text-xl font-bold text-red-700 text-center my-4"></h2>
<p id="emergencyText" class="leading-8"></p>
<a href="tel:997" class="btn primary block text-center mt-5" id="emergencyCall"></a>
<button class="btn border w-full mt-4" onclick="showResult()" id="emergencyBack"></button>
</section>

</main>

<footer class="bg-white border-t border-[#E8D8C5] text-center py-5 text-xs">
EarlyPath – درب الكشف المبكر
</footer>

let lang="ar",path="",stage="",answers={},selected=[],relatives=[],relativeAges={};

const $=id=>document.getElementById(id);
const t=k=>words[lang][k]??k;

function show(id){
["home","type","questions","result","emergency"].forEach(x=>$(x).classList.toggle("hidden",x!==id));
}

function setLanguage(l){
lang=l;
document.documentElement.lang=l;
document.documentElement.dir=l==="ar"?"rtl":"ltr";
$("brand").textContent=l==="ar"?"درب الكشف المبكر":"Early Detection Path";
$("typeTitle").textContent=t("type");
$("typeQuestion").textContent=t("question");
$("breastLabel").textContent=t("breast");
$("colonLabel").textContent=t("colon");
$("backHome").textContent=t("back");
$("backButton").textContent=t("back");
$("nextButton").textContent=t("next");
$("restartButton").textContent=t("home");
show("type");
}

function goHome(){
answers={};selected=[];relatives=[];relativeAges={};
path="";stage="";
show("home");
}

function goType(){show("type")}

function startPath(p){
path=p;
answers={};selected=[];relatives=[];relativeAges={};
stage=p==="breast"?"b_gender":"c_symptom";
render();
}

function makeOptions(items,multiple=false){
return `<div>${items.map((x,i)=>{
let value=multiple?String(i):String(x.value);
let label=multiple?x:x.label;
let isSelected=multiple?selected.includes(i):answers[stage]===value;
return `<button class="choice ${isSelected?'selected':''}" onclick="${multiple?`toggleMulti(${i})`:`choose('${value}')`}">
${multiple?(isSelected?'☑ ':'☐ '):''}${label}</button>`;
}).join("")}</div>`;
}

function choose(v){
answers[stage]=v;
advance();
}

function toggleMulti(i){
if(selected.includes(i))selected=selected.filter(x=>x!==i);
else selected.push(i);
render();
}

function render(){
let title="",html="",multi=false;
const yesno=[{value:"yes",label:t("yes")},{value:"no",label:t("no")},{value:"unknown",label:t("unknown")}];
const simple=(items)=>makeOptions(items);

switch(stage){

case"b_gender":
title=t("gender");
html=simple([{value:"female",label:t("female")},{value:"male",label:t("male")}]);
break;

case"b_symptom":
title=t("symB");
html=simple(yesno.slice(0,2));
break;

case"b_symptoms":
title=t("symListB");html=makeOptions(t("breastSymptoms"),true);break;

case"b_age":
title=t("age");
html=simple(t("ageBOptions").map((x,i)=>({value:String(i),label:x})));
break;

case"b_family":
title=t("familyB");html=simple(yesno);break;

case"b_relations":
title=t("relation");html=makeOptions(t("relatives"),true);break;

case"b_radiation":
title=t("radiation");html=simple(yesno);break;

case"b_mammo":
title=t("mammogram");
html=simple([
{value:"last23",label:t("last23")},
{value:"old23",label:t("old23")},
{value:"never",label:t("never")},
{value:"unknown",label:t("dontRemember")}
]);
break;

case"b_pregnant":
title=t("pregnant");html=simple(yesno.slice(0,2));break;

case"b_implants":
title=t("implants");html=simple(yesno.slice(0,2));break;

case"b_personal":
title=t("personalB");html=simple(yesno);break;

case"b_gene":
title=t("gene");html=simple(yesno);break;

case"b_geneName":
title=t("geneName");html=makeOptions(t("geneOptions"),true);break;

case"c_symptom":
title=t("symC");html=simple(yesno.slice(0,2));break;

case"c_symptoms":
title=t("symListC");html=makeOptions(t("colonSymptoms"),true);break;

case"c_gender":
title=t("gender");
html=simple([{value:"female",label:t("female")},{value:"male",label:t("male")}]);
break;

case"c_age":
title=t("age");
html=simple(t("ageCOptions").map((x,i)=>({value:String(i),label:x})));
break;

case"c_family":
title=t("familyC");html=simple(yesno);break;

case"c_relations":
title=t("relation");html=makeOptions(t("relatives"),true);break;

case"c_personal":
title=t("personalC");html=simple(yesno);break;

case"c_condition":
title=t("condition");html=simple(t("crcOptions").map((x,i)=>({value:String(i),label:x})));break;

case"c_when":
title=t("whenCondition");html=simple(t("whenOptions").map((x,i)=>({value:String(i),label:x})));break;

case"c_plan":
title=t("plan");html=simple(yesno);break;

case"c_ibd":
title=t("ibd");html=simple(t("ibdOptions").map((x,i)=>({value:String(i),label:x})));break;

case"c_lynch":
title=t("lynch");html=simple(t("lynchOptions").map((x,i)=>({value:String(i),label:x})));break;

case"c_radiation":
title=t("childRadiation");html=simple(yesno);break;

case"c_scope":
title=t("scope");html=simple(yesno);break;

case"c_scopeWhen":
title=t("scopeWhen");html=simple(t("scopeOptions").map((x,i)=>({value:String(i),label:x})));break;

case"c_fit":
title=t("fit");html=simple(yesno);break;

case"c_fitResult":
title=t("fitResult");
html=simple([
{value:"negative",label:t("negative")},
{value:"positive",label:t("positive")},
{value:"unknown",label:t("unknown")}
]);
break;

}

$("pathLabel").textContent=path==="breast"?t("breast"):t("colon");
$("stepLabel").textContent=t("next");
$("questionTitle").textContent=title;
$("questionBody").innerHTML=html;
$("backButton").textContent=t("back");
$("nextButton").textContent=t("next");
show("questions");
}

function advance(){

const next={

b_gender:"b_symptom",
b_symptom:answers.b_symptom==="yes"?"b_symptoms":"b_age",
b_age:"b_family",
b_family:answers.b_family==="yes"?"b_relations":"b_radiation",
b_relations:"b_radiation",
b_radiation:"b_mammo",
b_mammo:"b_pregnant",
b_pregnant:"b_implants",
b_implants:"b_personal",
b_personal:"b_gene",
b_gene:answers.b_gene==="yes"?"b_geneName":"b_result",
b_geneName:"b_result",

c_symptom:answers.c_symptom==="yes"?"c_symptoms":"c_gender",
c_gender:"c_age",
c_age:"c_family",
c_family:answers.c_family==="yes"?"c_relations":"c_personal",
c_relations:"c_personal",
c_personal:answers.c_personal==="yes"?"c_condition":"c_ibd",
c_condition:"c_when",
c_when:"c_plan",
c_plan:"c_ibd",
c_ibd:"c_lynch",
c_lynch:"c_radiation",
c_radiation:"c_scope",
c_scope:answers.c_scope==="yes"?"c_scopeWhen":"c_fit",
c_scopeWhen:"c_fit",
c_fit:answers.c_fit==="yes"?"c_fitResult":"c_result",
c_fitResult:"c_result"
};

if(stage==="b_symptoms"||stage==="c_symptoms"){
if(!selected.length){alert(t("select"));return}
showSymptomResult();
return;
}

if(stage==="b_relations"||stage==="c_relations"){
if(!selected.length){alert(t("select"));return}
relatives=selected.map(i=>t("relatives")[i]);
}

if(stage==="b_geneName"){
if(!selected.length){alert(t("select"));return}
answers.geneNames=selected.map(i=>t("geneOptions")[i]);
}

if(stage==="b_result"||stage==="c_result"){
showResult();return;
}

if(!answers[stage]&&stage!=="b_relations"&&stage!=="c_relations"&&stage!=="b_geneName"){
alert(t("select"));return;
}

stage=next[stage]||"b_result";
selected=[];
render();
}

function showSymptomResult(){
$("resultIcon").textContent="⚠️";
$("resultTitle").textContent=t("symTitle");
$("resultDescription").textContent=t("symDesc");
$("resultNote").textContent=t("nextSteps");
$("resultActions").innerHTML=`
<button class="btn primary" onclick="openNearby()">${t("nearby")}</button>
<a class="btn border text-center" target="_blank" rel="noopener" href="${videos[path]}">${t("video")}</a>
<button class="btn border sm:col-span-2" onclick="showEmergency()">${t("emergency")}</button>
`;
show("result");
}

function showEmergency(){
$("emergencyTitle").textContent=t("emTitle");
$("emergencyText").textContent=t("emergencyText");
$("emergencyCall").textContent=t("emCall");
$("emergencyBack").textContent=t("back");
show("emergency");
}

function showResult(){

let result="eligible";

if(path==="breast"){

if(
answers.b_personal==="yes"||
answers.b_gene==="yes"||
answers.b_radiation==="yes"||
answers.b_family==="yes"||
(answers.b_gender==="female"&&answers.b_implants==="yes")
){
result="custom";
}
else if(answers.b_gender==="male"||answers.b_age==="0"){
result="notEligible";
}
else if(answers.b_age==="1"){
result="custom";
}
else if(answers.b_mammo==="last23"){
result="notEligible";
}

}else{

if(
answers.c_fitResult==="positive"||
answers.c_personal==="yes"||
answers.c_family==="yes"||
answers.c_ibd==="0"||
answers.c_ibd==="1"||
answers.c_lynch==="0"||
answers.c_lynch==="1"||
answers.c_radiation==="yes"
){
result="custom";
}
else if(answers.c_age==="0"||answers.c_age==="3"){
result="notEligible";
}
else if(answers.c_age==="2"){
result="custom";
}

}

const data={
eligible:{
icon:"✅",
title:t("eligible"),
description:t("eligibleDesc")
},
custom:{
icon:"📋",
title:t("custom"),
description:t("customDesc")
},
notEligible:{
icon:"ℹ️",
title:t("notEligible"),
description:t("notEligibleDesc")
}
};

$("resultIcon").textContent=data[result].icon;
$("resultTitle").textContent=data[result].title;
$("resultDescription").textContent=data[result].description;
$("resultNote").textContent=t("nextSteps");

let actions="";

if(result!=="notEligible"){
actions+=`<button class="btn primary" onclick="openNearby()">${t("centers")}</button>`;
}

actions+=`<a class="btn border text-center" target="_blank" rel="noopener" href="${videos[path]}">${t("education")}</a>`;

$("resultActions").innerHTML=actions;
$("restartButton").textContent=t("home");
show("result");
}

function openNearby(){
if(!confirm(t("locationPrompt")))return;

const query=path==="breast"
?"breast cancer screening center hospital"
:"colorectal screening center hospital";

window.open(
"https://www.google.com/maps/search/"+encodeURIComponent(query),
"_blank"
);
}

$("emergencyBack").onclick=showResult;

</script>
</body>
</html>
